name: Release & Deploy Browser Extensions

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      submit_firefox:
        description: 'Submit to Firefox Add-ons (AMO)'
        required: true
        type: boolean
        default: true
      create_github_release:
        description: 'Create GitHub Release with Zip packages'
        required: true
        type: boolean
        default: true

jobs:
  build-and-deploy:
    name: Build, Verify & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Get Extension Version
        id: pkg
        run: |
          VERSION=$(node -p "require('./extension/package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Target Release Version: v$VERSION"

      - name: Install Root Dependencies
        run: npm ci

      - name: Install Extension Dependencies
        run: npm --prefix extension ci

      - name: Run Extension Unit Tests
        run: npm run test:ext

      - name: Build & Package Chrome and Firefox Extensions
        run: npm run package:all

      - name: Upload Release Artifacts to GitHub Release
        if: github.event.inputs.create_github_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          name: Release v${{ steps.pkg.outputs.version }}
          files: |
            extension/.output/releases/v*/*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Submit to Mozilla Add-ons (Firefox)
        if: github.event.inputs.submit_firefox == 'true'
        working-directory: ./extension
        run: npm run submit:firefox
        env:
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID || 'notion-job-scraper@lij0825.com' }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
